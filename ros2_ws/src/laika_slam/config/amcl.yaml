amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: omnidirectional  # Foxy: strings differential|omnidirectional (OmniMotionModel es de Humble)
    laser_model_type: likelihood_field
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    laser_min_range: 0.6
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    z_max: 0.05
    z_short: 0.05
    update_min_d: 0.1
    update_min_a: 0.1
    transform_tolerance: 0.5
    resample_interval: 1
    save_pose_rate: 0.5
    tf_broadcast: true
    set_initial_pose: false
map_server:
  ros__parameters:
    yaml_filename: /home/unitree/laika_maps/fase2_cuarto1.yaml
