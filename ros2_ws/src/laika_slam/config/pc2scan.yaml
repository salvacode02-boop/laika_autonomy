pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    min_height: -0.3   # piso -0.33 (medido); incluye piso cercano, SLAM filtra
    max_height: 0.6
    angle_min: -1.75
    angle_max: 1.75003  # N haces para p2l (ceil) = slam (floor+1)
    angle_increment: 0.0175
    scan_time: 0.2
    range_min: 0.6
    range_max: 10.0
    use_inf: true
