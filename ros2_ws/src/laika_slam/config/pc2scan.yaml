pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    min_height: -0.17   # z_piso (-0.33, medido) + 0.15
    max_height: 0.50
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.0667
    range_min: 0.5
    range_max: 10.0
    use_inf: true
